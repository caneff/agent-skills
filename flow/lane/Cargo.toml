[package]
name = "lane"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "lane"
path = "src/lib.rs"

[[bin]]
name = "implement-dispatch"
path = "src/bin/implement_dispatch.rs"

[[bin]]
name = "lane-fake"
path = "src/bin/lane_fake.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
