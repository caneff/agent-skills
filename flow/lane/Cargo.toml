[package]
name = "lane"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "lane"
path = "src/lib.rs"

[[bin]]
name = "implement-dispatch"
path = "src/bin/implement_dispatch.rs"

[[bin]]
name = "merge-cleanup"
path = "src/bin/merge_cleanup.rs"

[[bin]]
name = "resolve-controller"
path = "src/bin/resolve_controller.rs"

[[bin]]
name = "controller-restore"
path = "src/bin/controller_restore.rs"

[[bin]]
name = "lane-fake"
path = "src/bin/lane_fake.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
