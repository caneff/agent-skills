<!doctype html>
<meta charset="utf-8">
<title>Getting your attention — prototype</title>
<!--
  PROTOTYPE — throwaway. Round 4. Not wired to notify.sh.

  The floating dot widget stays quiet, which is what you liked and also what
  is wrong with it: when something finally wants you, nothing happens loud
  enough to pull your eye.

  So the widget is FIXED in all five variants — same pips, same corner, same
  resting look. Only the escalation changes:

  A1 flash and settle · A2 swell into a card · A3 glow at the screen edge ·
  A4 nag until acknowledged · A5 walk to the middle

  Press the buttons to fire an event whenever you want to see it again.
-->
<style>
  :root {
    --ink: #e8e8ea; --dim: #a0a0a8; --line: #3a3a42;
    --ok: #4ec9a0; --bad: #ff6b6b; --wait: #f0c674; --run: #6d7280;
    --accent: #d97757;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; overflow: hidden;
    font: 14px/1.45 "Segoe UI", system-ui, sans-serif; color: var(--ink);
    background: radial-gradient(120% 100% at 20% 0%, #3a4a6b 0%, #1b1f2a 55%, #14161c 100%);
  }
  .work { position: absolute; inset: 0 0 48px 0; display: grid; place-items: center; }
  .work-hint { color: #ffffff33; font-size: 13px; user-select: none; }
  .taskbar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 48px;
    background: #1a1a1ecc; border-top: 1px solid #ffffff14;
    display: flex; align-items: center; gap: 10px; padding: 0 12px;
  }
  .tb-icon { width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; background: #ffffff10; font-size: 15px; }
  .clock { margin-left: auto; font-size: 12px; text-align: right; line-height: 1.15; color: var(--dim); }

  /* ---- the widget, identical in every variant ---- */
  .widget {
    position: absolute; right: 18px; bottom: 62px;
    display: flex; align-items: center; gap: 10px;
    padding: 9px 13px; border-radius: 999px;
    background: #191a1fee; border: 1px solid #ffffff1f;
    box-shadow: 0 8px 22px #0008;
    transition: transform .5s cubic-bezier(.2,.9,.3,1.2), border-radius .3s, padding .3s, background .3s;
    cursor: pointer; z-index: 40;
  }
  .widget .pips { display: flex; gap: 5px; }
  .widget .pip { width: 8px; height: 8px; border-radius: 50%; background: var(--run); transition: background .3s; }
  .widget .count { font-size: 12px; color: var(--dim); white-space: nowrap; }
  .widget .count b { color: var(--ink); font-weight: 600; }
  .pulse { animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .35; } }

  /* A1 — a ring that expands and dies */
  .widget.flash { animation: flash 1s ease-out 3; }
  @keyframes flash {
    0%   { box-shadow: 0 8px 22px #0008, 0 0 0 0 var(--flash); }
    70%  { box-shadow: 0 8px 22px #0008, 0 0 0 26px transparent; }
    100% { box-shadow: 0 8px 22px #0008, 0 0 0 0 transparent; }
  }

  /* A2 — the widget itself becomes the card */
  .widget.card {
    border-radius: 10px; padding: 12px 15px; align-items: flex-start;
    flex-direction: column; gap: 5px; width: 300px; background: #23242bfa;
  }
  .widget.card .headline { font-size: 14px; font-weight: 600; }
  .widget.card .sub { font-size: 12.5px; color: #cfcfd6; }

  /* A3 — the whole screen edge takes the colour */
  .edge {
    position: fixed; inset: 0; pointer-events: none; z-index: 30;
    opacity: 0;
    box-shadow: inset 0 0 0 7px var(--flash), inset 0 0 130px -10px var(--flash);
  }
  .edge.on { animation: edge 1.1s ease-out 3; }
  @keyframes edge { 0% { opacity: 0; } 25% { opacity: .95; } 100% { opacity: 0; } }

  /* A4 — it will not stop until you deal with it */
  .widget.nag { animation: nag var(--nagrate, 1.8s) ease-in-out infinite; }
  @keyframes nag {
    0%, 100% { transform: scale(1);    box-shadow: 0 8px 22px #0008, 0 0 0 0 transparent; }
    50%      { transform: scale(1.07); box-shadow: 0 8px 22px #0008, 0 0 0 12px var(--flash); }
  }

  /* A5 — it comes to you */
  .widget.middle { transform: translate(-560px, -300px) scale(1.25); }

  .ack {
    position: absolute; right: 18px; bottom: 104px; font-size: 11px; color: #ffffff55;
  }
  .state {
    position: fixed; left: 14px; bottom: 14px; z-index: 98;
    background: #101014e6; border: 1px solid #ffffff1a; border-radius: 8px;
    padding: 8px 12px; font-size: 12px; color: var(--dim);
  }
  .state b { color: var(--ink); font-weight: 600; }

  .switcher {
    position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 4px; z-index: 99;
    background: #f4f4f5; color: #17171a; border-radius: 999px;
    box-shadow: 0 6px 24px #000a; padding: 5px 6px; font: 500 13px/1 "Segoe UI", system-ui, sans-serif;
  }
  .switcher button { border: 0; background: #17171a; color: #fff; width: 26px; height: 26px; border-radius: 999px; cursor: pointer; }
  .switcher .name { padding: 0 10px; white-space: nowrap; }
  .switcher .wide { width: auto; padding: 0 11px; font-weight: 600; }
  .switcher .fire-fail { background: #8c2f2f; }
  .switcher .fire-wait { background: #8a6a1f; }
  .switcher .fire-done { background: #2f6f5a; }
  .cost {
    position: fixed; left: 14px; top: 14px; max-width: 292px; z-index: 99;
    background: #101014e8; border: 1px solid #ffffff1a; border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 11px 13px; font-size: 12px; color: #c8c8d0;
  }
  .cost h6 { margin: 0 0 5px; font-size: 12px; color: var(--ink); }
  .cost p { margin: 0 0 6px; }
  .cost p:last-child { margin: 0; color: var(--dim); }
</style>

<div id="stage"></div>
<div class="taskbar"><span class="tb-icon">⊞</span><span class="tb-icon">🗔</span><span class="tb-icon">▤</span><span class="clock">2:41 PM<br>9/1/2026</span></div>
<div class="cost" id="cost"></div>
<div class="state" id="state"></div>
<div class="switcher">
  <button id="prev">‹</button><span class="name" id="vname"></span><button id="next">›</button>
  <button class="wide fire-done" id="f-done">finished</button>
  <button class="wide fire-wait" id="f-wait">needs you</button>
  <button class="wide fire-fail" id="f-fail">failed</button>
</div>

<script>
const COLOR = { done: "#4ec9a0", fail: "#ff6b6b", wait: "#f0c674", run: "#6d7280" };
const WORD  = { done: "finished", fail: "failed", wait: "needs you" };
const JOBS  = ["gridfind-ring-decode","burndown-42","sudoku-custom-ring","notify-hook-payload",
               "second-brain-retro","teach-lesson-base","rtk-proxy-cache","landed-page-rebuild"];
const ASK   = ["approve the push?","which title?","merge or rebase?","pick a base ref"];

// The same scripted run in every variant: two finishes, a failure, then a job
// that wants you. The failure at 3.0s is the moment worth watching.
const FEED = [
  { at: 1200, state: "done" },
  { at: 2100, state: "done" },
  { at: 3000, state: "fail" },
  { at: 6000, state: "wait" },
];

const stage = document.getElementById("stage");
let timers = [], nagTimer = null, seq = 0, wanted = 0, done = 0;
const at = (ms, fn) => timers.push(setTimeout(fn, ms));

// The widget is identical everywhere. Only what happens on an event changes.
function widget() {
  const w = document.createElement("div");
  w.className = "widget";
  w.innerHTML = `<span class="pips" id="pips"></span><span class="count" id="wc"><b>0</b> done</span>`;
  for (let i = 0; i < 8; i++) {
    const p = document.createElement("span");
    p.className = "pip" + (i > 3 ? " pulse" : "");
    p.id = "wp" + i;
    w.querySelector("#pips").append(p);
  }
  stage.append(w);
  return w;
}
function settle(w, e) {
  const p = w.querySelector("#wp" + (seq % 8));
  if (p) { p.classList.remove("pulse"); p.style.background = COLOR[e.state]; }
  if (e.state === "done") done++; else wanted++;
  const wc = w.querySelector("#wc");
  if (wc) wc.innerHTML = wanted
    ? `<b>${wanted}</b> want${wanted === 1 ? "s" : ""} you`
    : `<b>${done}</b> done`;
  seq++;
  say(`${e.job} ${WORD[e.state]}`);
}
function say(text) {
  document.getElementById("state").innerHTML = `last event: <b>${text}</b>`;
}
function nextEvent(state) {
  return { job: JOBS[seq % JOBS.length], state,
           detail: state === "wait" ? ASK[seq % ASK.length] : "" };
}

/* ---------------- A1 — flash and settle ---------------- */
const A1 = {
  name: "A1 — flash and settle",
  cost: ["A ring pushes out of the widget three times in the state's colour, then it goes quiet again. About three seconds of movement, and then nothing.",
         "Movement at the edge of your sight is what the eye catches, so it works without being bright or loud.",
         "Weakness: it is still a one-shot. Look away for four seconds and you missed it — exactly the complaint you had about the toast."],
  fire(w, e) {
    settle(w, e);
    w.style.setProperty("--flash", COLOR[e.state]);
    w.classList.remove("flash"); void w.offsetWidth; w.classList.add("flash");
  }
};

/* ---------------- A2 — swell into a card ---------------- */
const A2 = {
  name: "A2 — swell into a card",
  cost: ["The widget itself grows into a card, says which job and what happened, then shrinks back to a row of dots after a few seconds.",
         "It is a toast and the ambient thing in one object — the growth is the movement that catches you, and the words are already there when you look.",
         "Weakness: it takes over the corner while it is open, and a burst of events makes it flap open and shut."],
  fire(w, e) {
    settle(w, e);
    w.classList.add("card");
    w.innerHTML = `<span class="headline" style="color:${COLOR[e.state]}">${e.job} ${WORD[e.state]}</span>
                   <span class="sub">${e.detail || (wanted ? wanted + (wanted === 1 ? " job wants you" : " jobs want you") : done + " finished, nothing waiting")}</span>`;
    clearTimeout(w._cardTimer);
    w._cardTimer = setTimeout(() => { w.classList.remove("card"); rebuild(w); }, 3400);
    timers.push(w._cardTimer);
  }
};

/* ---------------- A3 — glow at the screen edge ---------------- */
const A3 = {
  name: "A3 — glow at the screen edge",
  cost: ["The whole screen border takes the state's colour and breathes three times. The widget does not move at all.",
         "Nothing on a monitor is harder to miss, and it needs no reading — red at the edge of the world means a job died.",
         "Weakness: it paints over everything you were doing. Fine for a failure, far too much for a job that merely finished."],
  fire(w, e) {
    settle(w, e);
    const edge = document.getElementById("edge");
    edge.style.setProperty("--flash", COLOR[e.state]);
    edge.classList.remove("on"); void edge.offsetWidth; edge.classList.add("on");
  },
  extra() {
    const e = document.createElement("div");
    e.className = "edge"; e.id = "edge"; stage.append(e);
  }
};

/* ---------------- A4 — nag until acknowledged ---------------- */
const A4 = {
  name: "A4 — nag until acknowledged",
  cost: ["It does not fire once. While anything is waiting on you the widget keeps breathing, and after a while it breathes faster. Clicking it stops it.",
         "This is the only one of the five you cannot miss by looking away, because it is still going when you look back.",
         "Weakness: an unread nag in the corner is a thing you learn to tune out — and then it is worse than silence, because you trust it."],
  fire(w, e) {
    settle(w, e);
    w.style.setProperty("--flash", COLOR[e.state]);
    if (!wanted) { w.classList.remove("nag"); return; }
    w.classList.add("nag");
    w.style.setProperty("--nagrate", "1.8s");
    clearTimeout(nagTimer);
    // It gets more insistent the longer you ignore it.
    nagTimer = setTimeout(() => w.style.setProperty("--nagrate", ".7s"), 5000);
  },
  extra(w) {
    w.onclick = () => { w.classList.remove("nag"); wanted = 0; clearTimeout(nagTimer);
                        w.querySelector("#wc").innerHTML = `<b>${done}</b> done`; say("acknowledged"); };
    const a = document.createElement("div"); a.className = "ack";
    a.textContent = "click the widget to acknowledge"; stage.append(a);
  }
};

/* ---------------- A5 — walk to the middle ---------------- */
const A5 = {
  name: "A5 — walk to the middle",
  cost: ["A finish changes a dot and nothing else. But a failure, or a job that wants you, slides the whole widget into the middle of the screen and parks it there until you click it.",
         "Attention by position rather than by brightness or noise. It lands where you are already looking, over the work.",
         "Weakness: it is in your way, on purpose. That is the whole idea, and it is also the reason it will annoy you at the wrong moment."],
  fire(w, e) {
    settle(w, e);
    if (e.state === "done") return;
    w.classList.add("middle");
  },
  extra(w) {
    w.onclick = () => { w.classList.remove("middle"); say("sent back to the corner"); };
    const a = document.createElement("div"); a.className = "ack";
    a.textContent = "click it to send it back"; stage.append(a);
  }
};

function rebuild(w) {
  // Put the pip row back after A2's card collapses, keeping the colours.
  const states = [...Array(8)].map((_, i) => w._pipState?.[i] || null);
  w.innerHTML = `<span class="pips" id="pips"></span><span class="count" id="wc"></span>`;
  for (let i = 0; i < 8; i++) {
    const p = document.createElement("span");
    p.className = "pip" + (i >= seq ? " pulse" : "");
    p.id = "wp" + i;
    if (i < seq) p.style.background = w._colors?.[i] || COLOR.done;
    w.querySelector("#pips").append(p);
  }
  w.querySelector("#wc").innerHTML = wanted
    ? `<b>${wanted}</b> want${wanted === 1 ? "s" : ""} you`
    : `<b>${done}</b> done`;
}

/* ---- switcher ---- */
const VARIANTS = { A1, A2, A3, A4, A5 };
const keys = Object.keys(VARIANTS);
const current = () => {
  const k = (new URLSearchParams(location.search).get("variant") || "A1").toUpperCase();
  return keys.includes(k) ? k : "A1";
};
let W = null, V = null;
function render() {
  timers.forEach(clearTimeout); timers = [];
  clearTimeout(nagTimer);
  seq = 0; wanted = 0; done = 0;
  stage.innerHTML = "";
  const work = document.createElement("div");
  work.className = "work";
  work.innerHTML = `<p class="work-hint">your editor, your terminal, whatever you were actually doing</p>`;
  stage.append(work);
  V = VARIANTS[current()];
  W = widget();
  W._colors = {};
  V.extra && V.extra(W);
  document.getElementById("vname").textContent = V.name;
  document.getElementById("cost").innerHTML = `<h6>${V.name}</h6>` + V.cost.map(c => `<p>${c}</p>`).join("");
  say("nothing yet");
  FEED.forEach(e => at(e.at, () => fire(e.state)));
}
function fire(state) {
  const e = nextEvent(state);
  W._colors[seq] = COLOR[state];
  V.fire(W, e);
}
const go = step => {
  const i = (keys.indexOf(current()) + step + keys.length) % keys.length;
  history.replaceState(null, "", "?variant=" + keys[i]);
  render();
};
document.getElementById("prev").onclick = () => go(-1);
document.getElementById("next").onclick = () => go(1);
["done", "wait", "fail"].forEach(s =>
  document.getElementById("f-" + s).onclick = () => fire(s));
addEventListener("keydown", e => {
  if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "ArrowRight") go(1);
});
render();
</script>
