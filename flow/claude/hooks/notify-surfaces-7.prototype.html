<!doctype html>
<meta charset="utf-8">
<title>Tuning the tab — prototype</title>
<!--
  PROTOTYPE — throwaway. Round 7. Not wired to notify.sh.

  S5 won: a standing job stretches its dot into a tab that pokes out of the
  rail. The open question is whether that grabs you enough without becoming
  the thing you resent.

  The two halves of that question pull apart:

    GRAB comes from CHANGE. A shape that is already there does not catch the
    eye; a shape that just moved does. So the grab has to happen at arrival.

    ANNOYANCE comes from REPEATED change. A static shape stops costing you
    anything within seconds. Motion that keeps going never stops costing.

  So: the tab is fixed, and the only thing that varies is how it ARRIVES and
  whether it escalates. Every variant is perfectly still once settled.

  T1 appear · T2 slide once · T3 slide and nudge · T4 lengthen while ignored ·
  T5 slide plus one edge flash

  Two controls: tab length, and N. The readout bottom left is the answer to
  "is it annoying" in a number — seconds of movement per hour.
-->
<style>
  :root {
    --ink: #e8e8ea; --dim: #a0a0a8; --line: #3a3a42;
    --ok: #4ec9a0; --bad: #ff6b6b; --wait: #f0c674; --run: #6d7280;
    --accent: #d97757;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; overflow: hidden;
    font: 14px/1.45 "Segoe UI", system-ui, sans-serif; color: var(--ink);
    background: radial-gradient(120% 100% at 20% 0%, #3a4a6b 0%, #1b1f2a 55%, #14161c 100%);
  }
  .work { position: absolute; inset: 0 0 48px 0; display: grid; place-items: center; }
  .work-hint { color: #ffffff33; font-size: 13px; user-select: none; }
  .taskbar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 48px;
    background: #1a1a1ecc; border-top: 1px solid #ffffff14;
    display: flex; align-items: center; gap: 10px; padding: 0 12px;
  }
  .tb-icon { width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; background: #ffffff10; font-size: 15px; }
  .clock { margin-left: auto; font-size: 12px; text-align: right; line-height: 1.15; color: var(--dim); }
  .clock b { color: var(--ink); font-weight: 600; }

  .rail {
    position: absolute; top: 50%; right: 0; transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: flex-end; gap: 7px;
    padding: 10px 7px; cursor: pointer; z-index: 40;
    background: #14141ab8; border: 1px solid #ffffff14; border-right: 0;
    border-radius: 10px 0 0 10px;
  }
  .rail .pip {
    width: 9px; height: 9px; border-radius: 999px; background: var(--run);
    transition: background .4s;
  }
  /* The tab. Width is set per variant; the transition is what differs. */
  .pip.tab { height: 11px; border-radius: 6px 0 0 6px; margin-right: -7px; }
  .pip.slide { transition: width .42s cubic-bezier(.2,.8,.3,1), background .4s; }
  .pip.nudge { animation: nudge .5s ease-out .42s 1; }
  @keyframes nudge { 40% { margin-right: -15px; } 100% { margin-right: -7px; } }
  .pip.creep { transition: width 1.2s ease-in-out, background .4s; }

  /* T5's one-shot flash at the edge — it fires and is gone */
  .edge {
    position: fixed; inset: 0; pointer-events: none; z-index: 30; opacity: 0;
    box-shadow: inset 0 0 0 6px var(--flash), inset 0 0 110px -14px var(--flash);
  }
  .edge.on { animation: edgeflash 1.1s ease-out 1; }
  @keyframes edgeflash { 0% { opacity: .95; } 100% { opacity: 0; } }

  .card {
    position: absolute; right: 40px; top: 50%; transform: translateY(-50%);
    width: 300px; background: #23242bfa; border: 1px solid #ffffff22;
    border-radius: 10px; padding: 12px 15px; box-shadow: 0 14px 34px #000b; z-index: 45;
  }
  .card .headline { font-size: 14px; font-weight: 600; }
  .card ul { margin: 5px 0 0; padding: 0; }
  .card li { list-style: none; display: flex; gap: 8px; font-size: 13px; padding: 1px 0; }
  .mark { font-weight: 700; }
  .mark.ok { color: var(--ok); } .mark.bad { color: var(--bad); } .mark.wait { color: var(--wait); }

  .beatbar {
    position: absolute; left: 14px; bottom: 108px; width: 330px;
    background: #191a1fdd; border: 1px solid #ffffff14; border-radius: 8px;
    padding: 10px 12px; font-size: 12px; color: var(--dim);
  }
  .beatbar .rule { color: #ffffff55; margin-bottom: 6px; }
  .beatbar b { color: var(--ink); font-weight: 600; }
  .beatbar .track { height: 3px; background: #ffffff1a; border-radius: 2px; margin-top: 8px; }
  .beatbar .track i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
  .ack { position: absolute; right: 34px; bottom: 96px; font-size: 11px; color: #ffffff55; }

  .score {
    position: fixed; left: 14px; bottom: 14px; z-index: 98; max-width: 340px;
    background: #101014e6; border: 1px solid #ffffff1a; border-radius: 8px;
    padding: 8px 12px; font-size: 12px; color: var(--dim);
  }
  .score b { color: var(--ink); font-weight: 600; }
  .score .big { font-size: 15px; }

  .switcher {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 4px; z-index: 99;
    background: #f4f4f5; color: #17171a; border-radius: 999px;
    box-shadow: 0 6px 24px #000a; padding: 5px 6px; font: 500 13px/1 "Segoe UI", system-ui, sans-serif;
  }
  .switcher button { border: 0; background: #17171a; color: #fff; width: 26px; height: 26px; border-radius: 999px; cursor: pointer; }
  .switcher .name { padding: 0 10px; white-space: nowrap; }
  .switcher .wide { width: auto; padding: 0 11px; font-weight: 600; }
  .switcher .len { background: #6b3f8c; }
  .switcher .n { background: #2f5f8c; }
  .switcher .replay { background: var(--accent); color: #1b1b1b; }
  .cost {
    position: fixed; left: 14px; top: 14px; max-width: 300px; z-index: 99;
    background: #101014e8; border: 1px solid #ffffff1a; border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 11px 13px; font-size: 12px; color: #c8c8d0;
  }
  .cost h6 { margin: 0 0 5px; font-size: 12px; color: var(--ink); }
  .cost p { margin: 0 0 6px; }
  .cost p:last-child { margin: 0; color: var(--dim); }
</style>

<div id="stage"></div>
<div class="taskbar">
  <span class="tb-icon">⊞</span><span class="tb-icon">🗔</span><span class="tb-icon">▤</span>
  <span class="clock" id="clock"></span>
</div>
<div class="cost" id="cost"></div>
<div class="score" id="score"></div>
<div class="switcher">
  <button id="prev">‹</button><span class="name" id="vname"></span><button id="next">›</button>
  <button class="wide len" id="len"></button>
  <button class="wide n" id="n"></button>
  <button class="wide replay" id="replay">replay</button>
</div>

<script>
const COLOR = { done: "#4ec9a0", fail: "#ff6b6b", wait: "#f0c674", run: "#6d7280" };
const MARK  = { done: "✔", fail: "✖", wait: "▲" };
const LEN   = { short: 22, medium: 34, long: 52 };

const FEED = [
  { m:  0.7, job: "gridfind-ring-decode", state: "done" },
  { m:  1.4, job: "notify-hook-payload",  state: "done" },
  { m:  2.3, job: "sudoku-custom-ring",   state: "fail" },
  { m:  3.1, job: "landed-page-rebuild",  state: "done" },
  { m:  4.6, job: "burndown-42",          state: "wait", detail: "approve the push?" },
  { m:  6.2, job: "second-brain-retro",   state: "done" },
  { m:  7.0, job: "rtk-proxy-cache",      state: "done" },
  { m:  9.5, job: "teach-lesson-base",    state: "wait", detail: "which title?" },
  { m: 11.0, job: "spec-slicer",          state: "fail" },
  { m: 12.3, job: "statusline-table",     state: "done" },
  { m: 13.1, job: "worktree-sweeper",     state: "done" },
  { m: 15.4, job: "memory-retro",         state: "done" },
  { m: 17.2, job: "visual-recap",         state: "wait", detail: "pick a base ref" },
  { m: 18.0, job: "ponytail-audit",       state: "done" },
];

// Each variant declares how long it moves per beat, in milliseconds. That is
// the whole annoyance budget, and it is the number the readout divides out.
const VARIANTS = {
  T1: {
    name: "T1 — it is just there",
    motion: 0,
    grab: "none — you find it on your next glance",
    cost: ["The tab appears with no animation at all. One frame it is a dot, the next it is a tab.",
           "Nothing on your screen ever moves, so there is nothing to resent. This is the floor for annoyance.",
           "Weakness: no change means no grab. You will not notice it happen — you will notice it the next time your eye passes the edge, which might be a minute or an hour."],
    arrive(pip) { pip.classList.add("tab"); }
  },
  T2: {
    name: "T2 — slide out once",
    motion: 420,
    grab: "0.42s of movement, once per beat",
    cost: ["The tab grows out of the dot over about four tenths of a second, then stops and never moves again.",
           "This is the smallest thing that can actually catch your eye. Motion at the edge of sight is what peripheral vision is for, and four tenths of a second is enough to register.",
           "It costs you five seconds of movement an hour at N = 5. That is the honest price of being noticed."],
    arrive(pip) { pip.classList.add("slide"); requestAnimationFrame(() => pip.classList.add("tab")); }
  },
  T3: {
    name: "T3 — slide and nudge",
    motion: 920,
    grab: "0.92s — a slide, then one overshoot",
    cost: ["The same slide, then the tab pushes out a little further and settles back — one nudge, like something tapping the edge of the screen.",
           "The second movement is what makes it survive a busy screen. A single slide can be lost against a scrolling terminal; a slide plus a nudge is a rhythm, and rhythm reads as deliberate.",
           "Weakness: two movements is where 'noticeable' starts turning into 'fidgety'. Watch it a few times and see if it is already too much."],
    arrive(pip) {
      pip.classList.add("slide");
      requestAnimationFrame(() => { pip.classList.add("tab"); pip.classList.add("nudge"); });
    }
  },
  T4: {
    name: "T4 — lengthen while ignored",
    motion: 0,
    grab: "none at arrival — but it keeps getting bigger",
    cost: ["It appears with no motion, like T1. But every few minutes it is still standing, the tab creeps a little longer. An hour of being ignored and it is unmissable.",
           "Escalation without ever moving fast enough to catch as motion. The change is real but slower than your eye reads as movement.",
           "Weakness: it solves the wrong half. It grabs you eventually, which is exactly what you already have — it does nothing at the moment the job actually needs you."],
    arrive(pip) { pip.classList.add("tab", "creep"); },
    creeps: true
  },
  T5: {
    name: "T5 — slide plus one edge flash",
    motion: 1520,
    grab: "0.42s slide + a single 1.1s flash at the screen edge",
    cost: ["The tab slides out as in T2, and at the same moment the whole screen edge flashes once in the state's colour and dies.",
           "You cannot miss this one, and it still leaves nothing moving afterwards. The flash is a single event, not a state.",
           "Weakness: this is the loudest thing here by a distance. Reserve it for a failure and it is right; fire it every beat and you have rebuilt the toast you started by hating."],
    arrive(pip, ev) {
      pip.classList.add("slide");
      requestAnimationFrame(() => pip.classList.add("tab"));
      const e = document.getElementById("edge");
      e.style.setProperty("--flash", COLOR[ev.state]);
      e.classList.remove("on"); void e.offsetWidth; e.classList.add("on");
    }
  },
};

const stage = document.getElementById("stage");
let timers = [], ticker = null, rail = null, V = null;
let settled = [], held = [], standing = [], beats = 0;
let t0 = Date.now();
const at = (ms, fn) => timers.push(setTimeout(fn, ms));
const now = () => (Date.now() - t0) / 1000;

function buildRail() {
  const r = document.createElement("div");
  r.className = "rail";
  FEED.forEach((e, i) => {
    const p = document.createElement("span");
    p.className = "pip"; p.id = "pip" + i;
    r.append(p);
  });
  r.onclick = clearStanding;
  stage.append(r);
  return r;
}
function clearStanding() {
  standing.forEach(e => {
    const p = document.getElementById("pip" + e.i);
    p.className = "pip";
    p.style.width = "";
  });
  standing = [];
  document.querySelector(".card")?.remove();
  score();
}
function beat() {
  const open = settled.filter(e => e.state !== "done");
  if (!held.length && !open.length) return;
  beats++;
  const done = held.filter(e => e.state === "done").length;
  document.querySelector(".card")?.remove();
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<span class="headline" style="color:${open.length ? "#f0c674" : "#4ec9a0"}">
      ${open.length ? open.length + " want" + (open.length === 1 ? "s" : "") + " you now" : "All clear"}</span>
    <ul>${(done ? `<li><span class="mark ok">✔</span> ${done} finished since the last beat</li>` : "") +
      open.map(e => `<li><span class="mark ${e.state === "fail" ? "bad" : "wait"}">${MARK[e.state]}</span>
        ${e.job}${e.detail ? ": " + e.detail : " failed"}</li>`).join("")}</ul>`;
  stage.append(card);
  at(4200, () => card.remove());
  held = [];
  // Only newly standing jobs arrive; the ones already out stay put.
  open.filter(e => !standing.includes(e)).forEach(e => {
    const p = document.getElementById("pip" + e.i);
    p.style.width = tabLen() + "px";
    V.arrive(p, e);
    standing.push(e);
    if (V.creeps) creep(p);
  });
  score();
}
function creep(p) {
  // Grows a little every three simulated minutes, up to twice its length.
  let w = tabLen();
  for (let k = 1; k <= 5; k++) at(k * 3000, () => {
    if (!p.classList.contains("tab")) return;
    w = Math.min(tabLen() * 2, w + tabLen() * 0.22);
    p.style.width = w + "px";
  });
}
function score() {
  const perHour = (V.motion * (60 / N()) / 1000).toFixed(1);
  document.getElementById("score").innerHTML =
    `movement: <b class="big">${perHour}s</b> per hour · grab: <b>${V.grab}</b><br>
     <b>${beats}</b> beat${beats === 1 ? "" : "s"} · <b>${standing.length}</b> standing`;
}

/* ---- run ---- */
const keys = Object.keys(VARIANTS);
const params = () => new URLSearchParams(location.search);
const current = () => {
  const k = (params().get("variant") || "T2").toUpperCase();
  return keys.includes(k) ? k : "T2";
};
const N = () => [2, 5, 15].includes(+params().get("n")) ? +params().get("n") : 5;
const lenName = () => LEN[params().get("len")] ? params().get("len") : "medium";
const tabLen = () => LEN[lenName()];

function render() {
  timers.forEach(clearTimeout); timers = [];
  clearInterval(ticker);
  settled = []; held = []; standing = []; beats = 0;
  stage.innerHTML = "";
  const work = document.createElement("div");
  work.className = "work";
  work.innerHTML = `<p class="work-hint">your editor, your terminal, whatever you were actually doing</p>`;
  stage.append(work);
  const edge = document.createElement("div");
  edge.className = "edge"; edge.id = "edge"; stage.append(edge);
  V = VARIANTS[current()];
  rail = buildRail();
  const bar = document.createElement("div");
  bar.className = "beatbar";
  bar.innerHTML = `<div class="rule">FIXED — beat every N min; a standing job wears a tab until cleared</div>
    <div><b id="bh">0</b> held · next beat in <b id="bn">–</b></div>
    <div class="track"><i id="bt" style="width:0"></i></div>`;
  stage.append(bar);
  const a = document.createElement("div");
  a.className = "ack"; a.textContent = "click the rail to clear"; stage.append(a);
  document.getElementById("vname").textContent = V.name;
  document.getElementById("len").textContent = "tab: " + lenName();
  document.getElementById("n").textContent = "N = " + N() + " min";
  document.getElementById("cost").innerHTML = `<h6>${V.name}</h6>` + V.cost.map(c => `<p>${c}</p>`).join("");
  score();

  t0 = Date.now();
  FEED.forEach((e, i) => at(e.m * 1000, () => {
    const ev = { ...e, i };
    settled.push(ev); held.push(ev);
    document.getElementById("pip" + i).style.background = COLOR[e.state];
  }));
  for (let k = 1; k * N() <= 20; k++) at(k * N() * 1000, beat);

  ticker = setInterval(() => {
    const m = now();
    const next = Math.ceil(m / N()) * N();
    document.getElementById("clock").innerHTML = `<b>${m.toFixed(0)} min</b><br>60× speed`;
    document.getElementById("bh").textContent = held.length;
    document.getElementById("bn").textContent = (next - m).toFixed(1) + " min";
    document.getElementById("bt").style.width = (1 - (next - m) / N()) * 100 + "%";
  }, 100);
}
function nav(patch) {
  const p = params();
  Object.entries(patch).forEach(([k, v]) => p.set(k, v));
  history.replaceState(null, "", "?" + p);
  render();
}
const go = s => nav({ variant: keys[(keys.indexOf(current()) + s + keys.length) % keys.length] });
document.getElementById("prev").onclick = () => go(-1);
document.getElementById("next").onclick = () => go(1);
document.getElementById("len").onclick = () => nav({ len: { short: "medium", medium: "long", long: "short" }[lenName()] });
document.getElementById("n").onclick = () => nav({ n: { 2: 5, 5: 15, 15: 2 }[N()] });
document.getElementById("replay").onclick = render;
addEventListener("keydown", e => {
  if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "ArrowRight") go(1);
  if (e.key === "n") nav({ n: { 2: 5, 5: 15, 15: 2 }[N()] });
  if (e.key === "l") nav({ len: { short: "medium", medium: "long", long: "short" }[lenName()] });
});
render();
</script>
